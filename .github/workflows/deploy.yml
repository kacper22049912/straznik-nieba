name: Wdrożenie (worker + strona)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  worker:
    name: Worker powiadomień (Cloudflare)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: deploy
        name: Wdróż workera
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Brak sekretów CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Strona zostanie wdrożona bez powiadomień w tle."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm ci --no-audit --no-fund
          # baza D1: utwórz, jeśli jeszcze nie istnieje
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="straznik-nieba") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create straznik-nieba
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="straznik-nieba") | .uuid')
          fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Nie znaleziono adresu workera w wyniku wdrożenia."; exit 1; fi
          curl -fsS "$URL/api/status" || true
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  pages:
    name: Strona (GitHub Pages)
    needs: worker
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Wpisz adres workera do config.js
        env:
          WORKER_URL: ${{ needs.worker.outputs.url }}
        run: |
          printf '/* Wygenerowane przy wdrożeniu. */\nself.SN_CONFIG = { worker: "%s" };\n' "$WORKER_URL" > site/config.js
          cat site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
