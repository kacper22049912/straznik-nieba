name = "straznik-nieba"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# co minutę: pobranie danych z NEPTUN, zapis historii, wysyłka powiadomień
[triggers]
crons = ["* * * * *"]

# database_id wstawia workflow GitHub Actions przy wdrożeniu
[[d1_databases]]
binding = "DB"
database_name = "straznik-nieba"
database_id = "__D1_ID__"
